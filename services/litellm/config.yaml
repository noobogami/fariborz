# LiteLLM gateway — the self-hosted router in front of every model.
#
# MODELS ARE NOT DEFINED HERE ANYMORE. They live in Fariborz's catalog
# (config/litellm.php) and are CREATED into this gateway's database
# (store_model_in_db) on demand — from Settings ▸ Tools ▸ "Gateway models"
# (a button), or `php artisan litellm:seed`. DB-backed models persist across
# restarts. This file only carries gateway-wide settings.
#
# (You can still add ad-hoc `- model_name:` entries under model_list below if you
# want file-pinned models alongside the DB ones; it's just no longer the norm.)

model_list: []

litellm_settings:
  # Silently drop params a given backend doesn't support (e.g. some local models
  # ignore max_tokens/temperature) instead of erroring the call.
  drop_params: true

# NOTE on auth: do NOT set general_settings.master_key here. LiteLLM reads the
# LITELLM_MASTER_KEY environment variable on its own — set it (compose / .env) to
# REQUIRE a Bearer token and mirror it into the app's "Gateway key" setting; leave
# it empty to run keyless on a trusted local network. (Pinning master_key to
# os.environ/LITELLM_MASTER_KEY here would enable auth even when the var is empty,
# locking everyone out with an unknown key.)

general_settings:
  # Serve models added at runtime via the admin UI (http://localhost:4000/ui) /
  # the /model/* API, stored in Postgres, ALONGSIDE the file-defined ones above.
  # Requires DATABASE_URL (set on the litellm service in docker-compose).
  store_model_in_db: true
